<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#030304">
  <meta name="description" content="Contact Inlur about Roblox development projects.">
  <title>Contact — Inlur</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Montserrat','Avenir Next','Arial','sans-serif']}}}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{background:#030304 radial-gradient(circle at 50% 24%,rgba(255,255,255,.035),transparent 34%)}.contact-row+.contact-row{border-top:1px solid rgba(255,255,255,.055)}</style>
</head>
<body class="min-h-screen font-sans text-white antialiased selection:bg-white/25">
  <header><nav class="mx-auto flex h-20 max-w-4xl items-center justify-between px-6"><a href="index.html" class="text-lg font-extrabold">inlur</a><a href="index.html" class="text-xs font-semibold text-zinc-500 transition hover:text-white">← Back home</a></nav></header>
  <main class="mx-auto max-w-4xl px-6 py-16 sm:py-24">
    <div class="mx-auto max-w-2xl text-center"><p class="mb-4 text-[10px] font-semibold uppercase tracking-[.3em] text-zinc-500">Contact</p><h1 class="bg-gradient-to-b from-white to-zinc-500 bg-clip-text text-5xl font-extrabold leading-[.95] tracking-[-.06em] text-transparent sm:text-7xl">Let's talk.</h1><p class="mx-auto mt-6 max-w-lg text-sm leading-7 text-zinc-500">For Roblox development, system architecture, UI work, or new experience opportunities.</p></div>
    <section class="mx-auto mt-12 max-w-xl" aria-label="Contact methods">
      <a href="mailto:contact@inlur.dev" class="contact-row flex items-center px-1 py-4 transition hover:bg-white/[.015]"><span><small class="block text-[9px] font-bold uppercase tracking-[.22em] text-zinc-600">Email</small><strong class="mt-1 block text-base">contact@inlur.dev</strong></span><span class="ml-auto text-zinc-700">↗</span></a>
      <button id="copy-discord" type="button" class="contact-row flex w-full items-center px-1 py-4 text-left transition hover:bg-white/[.015]"><span><small class="block text-[9px] font-bold uppercase tracking-[.22em] text-zinc-600">Discord</small><strong class="mt-1 block text-base">@inlurs</strong></span><span class="ml-auto text-[10px] text-zinc-700">Copy</span></button>
      <a href="https://www.roblox.com/users/1028929837/profile" target="_blank" rel="noreferrer" class="contact-row flex items-center px-1 py-4 transition hover:bg-white/[.015]"><span><small class="block text-[9px] font-bold uppercase tracking-[.22em] text-zinc-600">Roblox</small><strong class="mt-1 block text-base">inlurdev</strong></span><span class="ml-auto text-zinc-700">↗</span></a>
    </section>
  </main>
  <footer class="mx-auto max-w-4xl px-6 py-8 text-[10px] uppercase tracking-[.18em] text-zinc-800">© <span id="contact-year"></span> Inlur</footer>
  <script>document.getElementById('contact-year').textContent=new Date().getFullYear();document.getElementById('copy-discord').addEventListener('click',async e=>{const label=e.currentTarget.querySelector('strong');try{await navigator.clipboard.writeText('@inlurs');label.textContent='Copied @inlurs ✓';setTimeout(()=>label.textContent='@inlurs',1800)}catch{}});</script>
</body>
</html>
